[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "instagram-sync"
version = "1.0.0"
description = "Personal desktop Instagram media sync manager"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8,<7",
  "instaloader>=4.14,<5",
  "platformdirs>=4.3,<5",
  "browser-cookie3>=0.20,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
  "pyinstaller>=6.11,<7",
]

[project.scripts]
instagram-sync = "instagram_sync.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
